<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Nanolux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0c0c0d;
        --bg-2: #111214;
        --panel: #f1f1f1;
        --text: #f6f6f6;
        --muted: rgba(255,255,255,0.72);
        --gold: #d8b36a;
        --gold-strong: #d5a744;
        --field: #f1f1f1;
        --field-text: #1a1a1a;
        --input-border: rgba(0,0,0,0.08);
        --line: rgba(255,255,255,0.14);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: 'Outfit', sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        color: var(--text);
      }

      .phone-shell {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: var(--bg-2);
        padding-bottom: 22px;
        position: relative;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 10px;
        color: #f4f4f4;
        font-weight: 500;
        font-size: 16px;
        line-height: 1;
      }

      .time {
        font-size: 22px;
        letter-spacing: 0.5px;
        font-weight: 500;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
      }

      .signal {
        display: inline-flex;
        align-items: end;
        height: 14px;
      }

      .signal-bars {
        position: relative;
        width: 18px;
        height: 12px;
        display: inline-block;
      }

      .signal-bars::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.85);
        clip-path: polygon(0% 100%, 0% 55%, 20% 55%, 20% 100%, 40% 100%, 40% 40%, 60% 40%, 60% 100%, 80% 100%, 80% 25%, 100% 25%, 100% 100%);
      }

      .wifi {
        width: 18px;
        height: 12px;
        position: relative;
        display: inline-block;
        opacity: 0.9;
      }

      .wifi::before,
      .wifi::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255,255,255,0.85);
        border-top: 0;
        border-left-color: transparent;
        border-right-color: transparent;
        border-radius: 50%;
        transform: rotate(180deg);
      }

      .wifi::before {
        width: 14px;
        height: 9px;
        left: 2px;
        top: 2px;
      }

      .wifi::after {
        width: 7px;
        height: 4px;
        left: 5.5px;
        top: 8px;
      }

      .battery {
        width: 28px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.9);
        border-radius: 4px;
        position: relative;
        display: inline-block;
        margin-left: 2px;
      }

      .battery::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 16px;
        height: 6px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 6px;
        width: 3px;
        height: 6px;
        border-radius: 0 2px 2px 0;
        background: rgba(255,255,255,0.9);
      }

      .top-brand {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 18px 2px;
      }

      .brand {
        line-height: 0.88;
        letter-spacing: -2px;
      }

      .brand-word {
        display: inline-block;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: -4px;
        color: #f5f5f5;
      }

      .brand-mark {
        display: inline-block;
        position: relative;
        margin-left: 2px;
        font-size: 18px;
        color: var(--gold);
        transform: translateY(-18px);
      }

      .brand-sub {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        letter-spacing: 3px;
        color: rgba(255,255,255,0.8);
        text-transform: uppercase;
        font-weight: 500;
      }

      .menu {
        width: 42px;
        height: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin-right: 6px;
      }

      .menu span {
        display: block;
        width: 28px;
        height: 2px;
        background: rgba(255,255,255,0.9);
        border-radius: 999px;
      }

      .hero-wrap {
        padding: 12px 18px 0;
      }

      .hero {
        width: 100%;
        height: 246px;
        background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80');
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.45);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.44));
      }

      .content {
        padding: 18px 18px 0;
      }

      .title {
        font-size: 56px;
        line-height: 0.92;
        font-weight: 700;
        letter-spacing: -1.5px;
        margin: 0 0 18px;
        color: rgba(255,255,255,0.92);
      }

      .title .accent {
        color: var(--gold);
      }

      .form-wrap {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        width: 100%;
        border: 1px solid var(--input-border);
        background: rgba(255,255,255,0.93);
        color: var(--field-text);
        min-height: 58px;
        border-radius: 12px;
        font-family: 'Outfit', sans-serif;
        font-size: 24px;
        line-height: 1.2;
        padding: 14px 18px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .field::placeholder {
        color: rgba(17,17,17,0.58);
        font-weight: 400;
      }

      .field:focus {
        border-color: rgba(216, 179, 106, 0.9);
        box-shadow: 0 0 0 3px rgba(216,179,106,0.18);
      }

      textarea.field {
        min-height: 116px;
        resize: vertical;
      }

      .submit-wrap {
        width: 100%;
        padding-top: 4px;
      }

      .submit-btn {
        width: 100%;
        min-height: 60px;
        background: transparent;
        border: 2px solid var(--gold);
        border-radius: 12px;
        color: var(--gold);
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      }

      .submit-btn:hover,
      .submit-btn:focus {
        background: rgba(216, 179, 106, 0.08);
        box-shadow: 0 0 0 3px rgba(216,179,106,0.12);
      }

      .submit-btn:disabled {
        opacity: 0.8;
        cursor: wait;
      }

      .status-text {
        color: rgba(255,255,255,0.88);
        margin-top: 10px;
        font-size: 14px;
        min-height: 18px;
      }

      .status-text.success {
        color: #a9f5b2;
      }

      .status-text.error {
        color: #ff9e9e;
      }

      .email-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 22px 0 0;
        margin-top: 8px;
        color: #f5f5f5;
        font-size: 17px;
        line-height: 1;
      }

      .email-row a {
        color: #f5f5f5;
        text-decoration: none;
      }

      .email-icon {
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        padding: 4px;
      }

      .email-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }

      .bottom-bar {
        margin: 18px auto 0;
        width: 86%;
        height: 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
      }

      @media (max-width: 430px) {
        .phone-shell { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="status-bar">
        <div class="time">2:26</div>
        <div class="status-icons">
          <span class="signal"><span class="signal-bars"></span></span>
          <span>5G</span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="top-brand">
        <div class="brand" aria-label="NANOLUX logo">
          <span class="brand-word">NANOLUX</span>
          <span class="brand-mark">®</span>
          <span class="brand-sub">Paint Protection Film</span>
        </div>
        <div class="menu" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="hero-wrap">
        <div class="hero" aria-label="Car image"></div>
      </div>

      <div class="content">
        <h1 class="title">Contact <span class="accent">Us</span></h1>

        <form class="form-wrap" id="contactForm" novalidate>
          <input class="field" type="text" name="name" placeholder="Your Name" aria-label="Your Name" required />
          <input class="field" type="email" name="email" placeholder="Email" aria-label="Email" required />
          <input class="field" type="tel" name="phone" placeholder="Phone" aria-label="Phone" />
          <textarea class="field" name="message" placeholder="Message" aria-label="Message" required></textarea>

          <div class="submit-wrap">
            <button type="submit" class="submit-btn">Submit</button>
          </div>
          <div class="status-text" aria-live="polite"></div>
        </form>

        <div class="email-row">
          <span class="email-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Zm2.2-.75 6.8 5.42 6.8-5.4a.75.75 0 0 1 .75.75v.3L12 13.7 4.45 7.3v-.3a.75.75 0 0 1 .75-.75Zm14.55 2.5-7.1 5.66a1.25 1.25 0 0 1-1.3 0L4.25 8.5v8.75c0 .41.34.75.75.75h13.5c.41 0 .75-.34.75-.75V8.5Z"></path>
            </svg>
          </span>
          <a href="mailto:info@nanoluxppf.com">info@nanoluxppf.com</a>
        </div>
      </div>

      <div class="bottom-bar" aria-hidden="true"></div>
    </div>

    <script>
      const form = document.getElementById('contactForm');
      const submitBtn = form.querySelector('.submit-btn');
      const statusText = form.querySelector('.status-text');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        if (!payload.name || !payload.email || !payload.message) {
          statusText.textContent = 'Please fill in your name, email, and message.';
          statusText.className = 'status-text error';
          return;
        }

        submitBtn.disabled = true;
        statusText.textContent = 'Sending...';
        statusText.className = 'status-text';

        try {
          const response = await fetch('/.netlify/functions/send-contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to send message.');
          }

          statusText.textContent = 'Message sent successfully!';
          statusText.className = 'status-text success';
          form.reset();
        } catch (error) {
          statusText.textContent = error.message || 'Something went wrong. Please try again.';
          statusText.className = 'status-text error';
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
