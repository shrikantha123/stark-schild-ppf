<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0d0d;
        --bg-2: #111111;
        --panel: #efefef;
        --text: #f5f5f5;
        --muted: #c9c9c9;
        --gold: #d8b15b;
        --gold-soft: #d3a330;
        --field: #f1f1f1;
        --field-text: #1a1a1a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: 'Outfit', sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
      }

      .phone-shell {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: var(--bg-2);
        padding-bottom: 18px;
        position: relative;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 18px 10px 18px;
        color: #f4f4f4;
        font-weight: 500;
        font-size: 16px;
        line-height: 1;
      }

      .time {
        font-size: 22px;
        letter-spacing: 0.5px;
        font-weight: 500;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      .signal {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .signal-bars {
        position: relative;
        width: 18px;
        height: 12px;
      }

      .signal-bars::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.85);
        clip-path: polygon(0% 100%,0% 55%,20% 55%,20% 100%,40% 100%,40% 40%,60% 40%,60% 100%,80% 100%,80% 25%,100% 25%,100% 100%);
      }

      .wifi {
        width: 20px;
        height: 14px;
        position: relative;
        display: inline-block;
      }

      .wifi::before,
      .wifi::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255,255,255,0.85);
        border-top: 0;
        border-left-color: transparent;
        border-right-color: transparent;
        border-radius: 50%;
        transform: rotate(180deg);
      }

      .wifi::before {
        width: 16px;
        height: 10px;
        left: 2px;
        top: 2px;
      }

      .wifi::after {
        width: 8px;
        height: 5px;
        left: 6px;
        top: 9px;
      }

      .battery {
        width: 28px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.9);
        border-radius: 4px;
        position: relative;
        display: inline-block;
      }

      .battery::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 16px;
        height: 6px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 6px;
        width: 3px;
        height: 6px;
        border-radius: 0 2px 2px 0;
        background: rgba(255,255,255,0.9);
      }

      .top-brand {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px 6px 18px;
      }

      .brand {
        line-height: 0.88;
        letter-spacing: -2px;
      }

      .brand-word {
        display: inline-block;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: -4px;
        color: #f5f5f5;
      }

      .brand-mark {
        display: inline-block;
        position: relative;
        margin-left: 2px;
        font-size: 18px;
        color: var(--gold);
        transform: translateY(-18px);
      }

      .brand-sub {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        letter-spacing: 3px;
        color: rgba(255,255,255,0.8);
        font-weight: 500;
        text-transform: uppercase;
      }

      .menu {
        width: 44px;
        height: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin-right: 4px;
      }

      .menu span {
        display: block;
        width: 28px;
        height: 2px;
        background: rgba(255,255,255,0.9);
        border-radius: 999px;
      }

      .hero-wrap {
        padding: 10px 18px 0 18px;
      }

      .hero {
        width: 100%;
        height: 250px;
        background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80');
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.45);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.42));
      }

      .content {
        padding: 18px 18px 0 18px;
      }

      .title {
        font-size: 56px;
        line-height: 0.92;
        font-weight: 700;
        letter-spacing: -1.5px;
        margin: 0 0 20px;
        color: rgba(255,255,255,0.92);
      }

      .title .accent {
        color: var(--gold);
      }

      .form-wrap {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        width: 100%;
        border: none;
        background: rgba(255,255,255,0.95);
        color: var(--field-text);
        min-height: 56px;
        border-radius: 12px;
        font-family: 'Outfit', sans-serif;
        font-size: 24px;
        line-height: 1.2;
        padding: 14px 18px;
        outline: none;
      }

      .field::placeholder {
        color: rgba(17,17,17,0.58);
        font-weight: 400;
      }

      textarea.field {
        min-height: 112px;
        resize: vertical;
      }

      .submit-wrap {
        width: 100%;
        padding-top: 4px;
      }

      .submit-btn {
        width: 100%;
        min-height: 58px;
        background: transparent;
        border: 2px solid var(--gold);
        border-radius: 12px;
        color: var(--gold);
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0;
        cursor: pointer;
      }

      .email-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 22px 0 0 0;
        margin-top: 8px;
        color: #f5f5f5;
        font-size: 17px;
        line-height: 1;
      }

      .email-icon {
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        padding: 4px;
      }

      .email-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }

      .bottom-bar {
        margin: 18px auto 0;
        width: 86%;
        height: 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
      }

      @media (max-width: 430px) {
        .phone-shell { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="status-bar">
        <div class="time">2:26</div>
        <div class="status-icons">
          <span class="signal"><span class="signal-bars"></span></span>
          <span>5G</span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="top-brand">
        <div class="brand" aria-label="NANOLUX logo">
          <span class="brand-word">NANOLUX</span>
          <span class="brand-mark">®</span>
          <span class="brand-sub">Paint Protection Film</span>
        </div>
        <div class="menu" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="hero-wrap">
        <div class="hero" aria-label="Car image"></div>
      </div>

      <div class="content">
        <h1 class="title">Contact <span class="accent">Us</span></h1>

        <form class="form-wrap">
          <input class="field" type="text" name="name" placeholder="Your Name" />
          <input class="field" type="email" name="email" placeholder="Email" />
          <input class="field" type="tel" name="phone" placeholder="Phone" />
          <textarea class="field" name="message" placeholder="Message"></textarea>

          <div class="submit-wrap">
            <button type="submit" class="submit-btn">Submit</button>
          </div>
        </form>

        <div class="email-row">
          <span class="email-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Zm2.2-.75 6.8 5.42 6.8-5.42H5.2Zm13.55 2.27-6.13 4.9a.75.75 0 0 1-.92 0L5.25 8.27v9a.75.75 0 0 0 .75.75h12a.75.75 0 0 0 .75-.75v-9Z"/></svg>
          </span>
          <span>info@nanoluxppf.com</span>
        </div>
      </div>

      <div class="bottom-bar" aria-hidden="true"></div>
    </div>
  </body>
</html>
